<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preload" href="/fonts/space-grotesk-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!--
      Runs before paint: decides whether the 1.1s logo intro plays (first visit only,
      never under prefers-reduced-motion) and flags capabilities for CSS.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        try {
          var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          if (!rm && !localStorage.getItem('pgl-intro-seen')) {
            d.classList.add('intro-on', 'intro-delay');
            localStorage.setItem('pgl-intro-seen', '1');
            setTimeout(function () { d.classList.remove('intro-on'); }, 1200);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="intro" aria-hidden="true">
      <div class="intro__wipe"></div>
      <div class="intro__inner">
        <img class="intro__logo" src="/brand/logo-circle.svg" width="88" height="88" alt="" />
        <span class="intro__word">PRECISE GOLD</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
